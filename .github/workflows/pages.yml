name: GitHub Pages'e Yayınla

on:
  push:
    branches: [claude/mobile-games-kemal-sco4pf]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pages'i ayarla
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Site dosyalarını paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
