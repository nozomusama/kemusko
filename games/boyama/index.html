<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Boyama 🖍️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    touch-action: none;
    font-family: "Comic Sans MS", "Chalkboard SE", "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    background: #ffe9f0;
  }
  #game { display: block; width: 100vw; height: 100vh; }
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2vh 3vw;
    z-index: 5;
    pointer-events: none;
  }
  header > * { pointer-events: auto; }
  .home-btn {
    text-decoration: none;
    font-size: clamp(28px, 8vw, 44px);
    background: #fff;
    border-radius: 50%;
    width: clamp(52px, 14vw, 76px);
    height: clamp(52px, 14vw, 76px);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 5px 0 rgba(0,0,0,.15);
  }
  .home-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .badge {
    font-size: clamp(20px, 5.5vw, 32px);
    font-weight: bold;
    color: #444;
    background: #fff;
    border-radius: 20px;
    padding: 1vh 4vw;
    box-shadow: 0 5px 0 rgba(0,0,0,.15);
  }
  /* Alt kalem paleti */
  #palette {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.6vw;
    padding: 1.5vh 2vw calc(1.5vh + env(safe-area-inset-bottom, 0px));
    background: rgba(255,255,255,.72);
    border-top-left-radius: 26px;
    border-top-right-radius: 26px;
    z-index: 5;
  }
  .pen {
    width: clamp(38px, 9.6vw, 58px);
    height: clamp(38px, 9.6vw, 58px);
    border-radius: 50%;
    border: 4px solid #fff;
    box-shadow: 0 4px 0 rgba(0,0,0,.2);
    transition: transform .12s;
  }
  .pen.sel { transform: scale(1.25) translateY(-4px); border-color: #333; }
  /* Sünger bir renk değil, araç: paletin üstünde ayrı ve kocaman durur */
  #sponge {
    position: fixed;
    right: 4vw;
    bottom: calc(11vh + env(safe-area-inset-bottom, 0px));
    width: clamp(60px, 16vw, 86px);
    height: clamp(60px, 16vw, 86px);
    border-radius: 50%;
    background: #fff;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: clamp(32px, 9vw, 50px);
    box-shadow: 0 5px 0 rgba(0,0,0,.2);
    z-index: 6;
  }
  #sponge.show { display: flex; }
  #sponge.hint { animation: wiggle .5s infinite; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-9deg) scale(1.12); }
    50% { transform: rotate(9deg) scale(1.12); }
  }
  /* Boyama yeterince dolunca çıkar; basmak Kemal'in kararı, isterse boyamaya devam eder */
  #next {
    position: fixed;
    left: 4vw;
    bottom: calc(11vh + env(safe-area-inset-bottom, 0px));
    width: clamp(60px, 16vw, 86px);
    height: clamp(60px, 16vw, 86px);
    border-radius: 50%;
    background: #4caf50;
    border: 5px solid #fff;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: clamp(30px, 8vw, 46px);
    box-shadow: 0 5px 0 rgba(0,0,0,.2);
    z-index: 6;
  }
  #next.show { display: flex; animation: heartbeat 1.1s ease-in-out infinite; }
  #next:active { transform: translateY(3px) scale(.94); }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.14); }
  }
  #celebrate {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,.5);
    z-index: 10;
    pointer-events: none;
  }
  #celebrate.show { display: flex; }
  #celebrate .msg {
    font-size: clamp(70px, 24vw, 150px);
    animation: bounce .6s infinite alternate;
  }
  @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.25); } }
  .confetti {
    position: fixed;
    top: -5vh;
    font-size: clamp(20px, 6vw, 36px);
    animation: fall linear forwards;
    z-index: 11;
    pointer-events: none;
  }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }
</style>
</head>
<body>

    <a class="home-btn" href="../../index.html">🏠</a>

    lfo.connect(lfoDepth).connect(modGain.gain);
    lfo.start();
    // Ana kapı: 0 olduğunda ses tamamen susar
    scratchGain = audioCtx.createGain();
    scratchGain.gain.value = 0;
    src.connect(scratchFilter).connect(modGain).connect(scratchGain).connect(audioCtx.destination);
    src.start();
  }
  function holdGain(g, t) {
    if (g.cancelAndHoldAtTime) g.cancelAndHoldAtTime(t);
    else g.cancelScheduledValues(t);
  }
  function scratch(level) {
    if (!scratchGain) return;
    var t = audioCtx.currentTime;
    holdGain(scratchGain.gain, t);
    scratchGain.gain.setTargetAtTime(Math.min(0.12, level), t, 0.05);
    scratchFilter.frequency.setTargetAtTime(1800 + level * 9000, t, 0.08);
  }
  function scratchOff() {
    if (!scratchGain) return;
    var t = audioCtx.currentTime;
    holdGain(scratchGain.gain, t);
    scratchGain.gain.setTargetAtTime(0, t, 0.05);
    scratchGain.gain.setValueAtTime(0, t + 0.3);   // üstel iniş sıfıra ulaşmaz: sert sustur
  }
  function beep(freq, dur, type, delay, vol) {
    if (!audioCtx) return;
    var t = audioCtx.currentTime + (delay || 0);
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.22, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur);
  }
  function soundPop(n)    { beep(620 + n * 70, 0.14, "triangle"); }
  function soundUps()     { beep(523, 0.14, "sine", 0, 0.15); beep(392, 0.18, "sine", 0.13, 0.15); }
  function soundReady()   { beep(784, 0.16, "sine", 0, 0.16); beep(1047, 0.22, "sine", 0.14, 0.16); }
  function soundWin()     { [523, 659, 784, 1047].forEach(function (f, i) { beep(f, 0.25, "sine", i * 0.14); }); }
  function soundTrophy()  { [523, 659, 784, 1047, 784, 1047, 1319].forEach(function (f, i) { beep(f, 0.24, "sine", i * 0.13); }); }
  function soundSponge() {
    if (!audioCtx || !noiseBuf) return;
    var t = audioCtx.currentTime;
    var src = audioCtx.createBufferSource();
    src.buffer = noiseBuf;
    var hp = audioCtx.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.setValueAtTime(300, t);
    hp.frequency.linearRampToValueAtTime(900, t + 0.25);
    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0.18, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    src.connect(hp).connect(g).connect(audioCtx.destination);
    src.start(t);
    src.stop(t + 0.3);
  }
  document.addEventListener("pointerdown", ensureAudio);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && audioCtx) audioCtx.suspend();
  });

  // ---- Yerleşim ----
  function resize() {
    var oldIn = null, oldOut = null;
    if (W > 0) {
      // Boya kaybolmasın: eski katmanları sakla, yeni boyuta ölçekleyerek geri bas
      oldIn = document.createElement("canvas");
      oldIn.width = paintIn.width; oldIn.height = paintIn.height;
      oldIn.getContext("2d").drawImage(paintIn, 0, 0);
      oldOut = document.createElement("canvas");
      oldOut.width = paintOut.width; oldOut.height = paintOut.height;
      oldOut.getContext("2d").drawImage(paintOut, 0, 0);
    }

    DPR = Math.min(window.devicePixelRatio || 1, 2);
    PDPR = Math.min(DPR, 1.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    // CSS boyutunu piksel olarak sabitle: 100vh mobilde adres çubuğu gizliyken
    // ölçülen yüksekliği verir ve canvas gerilerek dokunma noktası kayardı
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    paintIn.width = Math.round(W * PDPR); paintIn.height = Math.round(H * PDPR);
    paintOut.width = paintIn.width; paintOut.height = paintIn.height;
    pinCtx.setTransform(PDPR, 0, 0, PDPR, 0, 0);
    poutCtx.setTransform(PDPR, 0, 0, PDPR, 0, 0);

    if (oldIn) {
      pinCtx.save(); pinCtx.setTransform(1, 0, 0, 1, 0, 0);
      pinCtx.drawImage(oldIn, 0, 0, paintIn.width, paintIn.height);
      pinCtx.restore();
      poutCtx.save(); poutCtx.setTransform(1, 0, 0, 1, 0, 0);
      poutCtx.drawImage(oldOut, 0, 0, paintOut.width, paintOut.height);
      poutCtx.restore();
    }

    layoutFigure();
    if (fig) buildMasks();
  }

  function layoutFigure() {
    if (!fig) return;
    var headerH = Math.min(Math.max(52, W * 0.14), 76) + H * 0.05;
    var paletteH = Math.min(Math.max(42, W * 0.11), 64) + H * 0.06;
    var availW = W * 0.86;
    var availH = (H - headerH - paletteH) * 0.94;
    figS = Math.min(availW, availH / fig.aspect);
    figX = (W - figS) / 2;
    figY = headerH + (availH - figS * fig.aspect) / 2;
    outlineW = Math.max(10, figS * 0.05);
    bandW = outlineW * 1.6;
    brushR = Math.max(16, Math.min(30, Math.min(W, H) * 0.045)) * tier().brush;
    bbox = { x: figX, y: figY, w: figS, h: figS * fig.aspect };
  }

  // Yolu verilen context'e kurar (CTM kuruluş anında uygulanır — Path2D gerekmez)
  function buildPath(c, sx, sy, s) {
    c.save();
    c.translate(sx, sy);
    c.scale(s, s);
    c.beginPath();
    fig.path(c);
    c.restore();
  }
  function buildFigPath(c) { buildPath(c, figX, figY, figS); }

  // ---- Ölçüm maskeleri (bölüm başına bir kez) ----
  function buildMasks() {
    var scale = MEAS_IN / Math.max(bbox.w, bbox.h);
    measIn.width = Math.max(1, Math.round(bbox.w * scale));
    measIn.height = Math.max(1, Math.round(bbox.h * scale));
    minCtx.setTransform(1, 0, 0, 1, 0, 0);
    minCtx.clearRect(0, 0, measIn.width, measIn.height);
    // Figürü ölçüm ızgarasına çiz (bbox köşesi ızgaranın 0,0'ı olur)
    buildPath(minCtx, (figX - bbox.x) * scale, (figY - bbox.y) * scale, figS * scale);
    minCtx.fillStyle = "#fff";
    minCtx.fill();
    // Konturun kapladığı şerit paydadan düşsün (çocuk yalnız gördüğü beyazı doldursun)
    minCtx.save();
    minCtx.globalCompositeOperation = "destination-out";
    minCtx.lineWidth = outlineW * scale;
    minCtx.stroke();
    minCtx.restore();

    var d = minCtx.getImageData(0, 0, measIn.width, measIn.height).data;
    interiorBits = new Uint8Array(measIn.width * measIn.height);
    interiorCount = 0;
    for (var i = 0; i < interiorBits.length; i++) {
      if (d[i * 4 + 3] >= 128) { interiorBits[i] = 1; interiorCount++; }
    }
    if (interiorCount < 1) interiorCount = 1;

    var os = MEAS_OUT / Math.max(W, H);
    measOut.width = Math.max(1, Math.round(W * os));
    measOut.height = Math.max(1, Math.round(H * os));
  }

  function measure() {
    if (!interiorBits) return;
    var scale = measIn.width / bbox.w;
    minCtx.setTransform(1, 0, 0, 1, 0, 0);
    minCtx.clearRect(0, 0, measIn.width, measIn.height);
    minCtx.drawImage(paintIn,
      bbox.x * PDPR, bbox.y * PDPR, bbox.w * PDPR, bbox.h * PDPR,
      0, 0, measIn.width, measIn.height);
    var d = minCtx.getImageData(0, 0, measIn.width, measIn.height).data;
    var inCount = 0, i;
    for (i = 0; i < interiorBits.length; i++) {
      if (interiorBits[i] && d[i * 4 + 3] >= PAINT_ALPHA_MIN) inCount++;
    }
    coverage = inCount / interiorCount;

    moutCtx.setTransform(1, 0, 0, 1, 0, 0);
    moutCtx.clearRect(0, 0, measOut.width, measOut.height);
    moutCtx.drawImage(paintOut, 0, 0, measOut.width, measOut.height);
    var od = moutCtx.getImageData(0, 0, measOut.width, measOut.height).data;
    var outCount = 0;
    for (i = 0; i < measOut.width * measOut.height; i++) {
      if (od[i * 4 + 3] >= PAINT_ALPHA_MIN) outCount++;
    }
    // Dış ızgaranın hücresi daha kaba: taşmayı iç ızgara hücre alanına çevir
    var sOutX = measOut.width / W, sOutY = measOut.height / H;
    var cellRatio = (scale * scale) / (sOutX * sOutY);
    overflow = (outCount * cellRatio) / interiorCount;
    if (overflow > peakOverflow) peakOverflow = overflow;

    // Soldurma kalıntısı temizliği
    if (overflow < 0.002 && outCount > 0 && tier().show === "fade") {
      poutCtx.save();
      poutCtx.setTransform(1, 0, 0, 1, 0, 0);
      poutCtx.clearRect(0, 0, paintOut.width, paintOut.height);
      poutCtx.restore();
      overflow = 0;
    }

    updateSponge();
    updateReady();
  }

  // Bölüm kendiliğinden bitmez: yeterince dolunca "bitti" butonu belirir,
  // basmak çocuğun kararıdır — isterse boyamaya devam eder.
  function updateReady() {
    if (state !== "painting") return;
    var t = tier();
    var isReady = coverage >= t.cover && (t.show !== "stick" || overflow <= t.maxOver);
    if (isReady && !ready) {
      ready = true;
      readyAt = performance.now();     // çözüm süresi: serbest boyama süresi sayılmaz
      soundReady();
    } else if (!isReady && ready) {
      ready = false;
    }
    nextBtn.classList.toggle("show", ready);
  }

  function updateSponge() {
    var t = tier();
    var need = t.show === "stick";
    spongeBtn.classList.toggle("show", need);
    // Doluluk tamam ama taşma engelliyorsa süngeri salla (okumasız ipucu)
    spongeBtn.classList.toggle("hint", need && coverage >= t.cover && overflow > t.maxOver);
  }

  // ---- Boyama ----
  function buildStamps() {
    stamps = [];
    for (var v = 0; v < STAMP_VARIANTS; v++) {
      var cv = document.createElement("canvas");
      cv.width = cv.height = STAMP_PX;
      var c = cv.getContext("2d");
      var r = STAMP_PX / 2;
      var g = c.createRadialGradient(r, r, 0, r, r, r);
      g.addColorStop(0, hexA(color, 0.3));
      g.addColorStop(0.65, hexA(color, 0.18));
      g.addColorStop(1, hexA(color, 0));
      c.fillStyle = g;
      c.beginPath(); c.arc(r, r, r, 0, Math.PI * 2); c.fill();
      // Grenli mum dokusu
      for (var i = 0; i < 40; i++) {
        var a = Math.random() * Math.PI * 2;
        var rad = Math.sqrt(Math.random()) * r * 0.92;
        c.fillStyle = hexA(color, 0.15 + Math.random() * 0.35);
        c.beginPath();
        c.arc(r + Math.cos(a) * rad, r + Math.sin(a) * rad, 1 + Math.random() * 2, 0, Math.PI * 2);
        c.fill();
      }
      stamps.push(cv);
    }
    stampColor = color;
  }
  function hexA(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return "rgba(" + r + "," + g + "," + b + "," + a + ")";
  }

  function stampAt(c, x, y) {
    var sz = brushR * 2 * (0.9 + Math.random() * 0.2);
    var s = stamps[(Math.random() * stamps.length) | 0];
    c.drawImage(s, x - sz / 2, y - sz / 2, sz, sz);
  }

  // Bir darbe parçasını hem iç hem dış katmana uygular
  function paintSegment(pts) {
    if (!pts.length) return;
    if (stampColor !== color) buildStamps();
    var i;

    // İç: figüre clip
    pinCtx.save();
    buildFigPath(pinCtx);
    pinCtx.clip();
    for (i = 0; i < pts.length; i++) stampAt(pinCtx, pts[i][0], pts[i][1]);
    pinCtx.restore();

    // Dış: ters clip (evenodd ile figür hariç tüm ekran)
    poutCtx.save();
    poutCtx.beginPath();
    poutCtx.rect(0, 0, W, H);
    buildFigPathAppend(poutCtx);
    poutCtx.clip("evenodd");
    for (i = 0; i < pts.length; i++) stampAt(poutCtx, pts[i][0], pts[i][1]);
    poutCtx.restore();

    // Kontur bandını dış katmandan sil: bant ne iç ne taşma sayılır
    poutCtx.save();
    poutCtx.globalCompositeOperation = "destination-out";
    buildFigPath(poutCtx);
    poutCtx.lineWidth = bandW;
    poutCtx.stroke();
    poutCtx.restore();

    dirty = true;
  }

  // beginPath çağırmadan mevcut yola figürü ekler (ters clip için)
  function buildFigPathAppend(c) {
    c.save();
    c.translate(figX, figY);
    c.scale(figS, figS);
    fig.path(c);
    c.restore();
  }

  function isOutside(x, y) {
    buildFigPath(hitCtx);
    return !hitCtx.isPointInPath(x, y);
  }

  // Dokunma noktasını canvas'ın gerçek yerleşimine göre çevir (kalibrasyon)
  function pointerPos(e) {
    var r = canvas.getBoundingClientRect();
    return [
      (e.clientX - r.left) * (W / (r.width || W)),
      (e.clientY - r.top) * (H / (r.height || H))
    ];
  }

  canvas.addEventListener("pointerdown", function (e) {
    ensureAudio();
    if (state !== "painting") return;
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
    var p = pointerPos(e);
    strokes[e.pointerId] = p;
    paintSegment([p]);
    e.preventDefault();
  });

  canvas.addEventListener("pointermove", function (e) {
    if (state !== "painting") return;
    var last = strokes[e.pointerId];
    if (!last) return;
    var evts = (e.getCoalescedEvents ? e.getCoalescedEvents() : null) || [e];
    var pts = [];
    var spacing = Math.max(2, brushR * 0.4);
    var speed = 0;
    for (var k = 0; k < evts.length; k++) {
      var p = pointerPos(evts[k]);
      var dx = p[0] - last[0], dy = p[1] - last[1];
      var dist = Math.sqrt(dx * dx + dy * dy);
      speed += dist;
      var steps = Math.max(1, Math.ceil(dist / spacing));
      for (var i = 1; i <= steps; i++) {
        pts.push([last[0] + dx * i / steps, last[1] + dy * i / steps]);
      }
      last = p;
    }
    strokes[e.pointerId] = last;
    paintSegment(pts);
    scratch(Math.min(0.12, 0.02 + speed * 0.0025));

    // Taşma uyarısı: yalnız taşmanın görünür olduğu kademelerde
    var t = tier();
    if (t.show !== "none" && pts.length && isOutside(pts[pts.length - 1][0], pts[pts.length - 1][1])) {
      var now = performance.now();
      if (now - lastUps > 2000) { lastUps = now; soundUps(); }
    }
    e.preventDefault();
  });

  function endStroke(e) {
    if (strokes[e.pointerId]) {
      delete strokes[e.pointerId];
      if (!Object.keys(strokes).length) scratchOff();
      lastMeas = 0;   // hemen ölç
    }
  }
  canvas.addEventListener("pointerup", endStroke);
  canvas.addEventListener("pointercancel", endStroke);
  canvas.addEventListener("pointerleave", endStroke);

  // ---- Palet ----
  var spongeBtn = document.createElement("div");
  spongeBtn.id = "sponge";
  spongeBtn.textContent = "🧽";

  var nextBtn = document.createElement("div");
  nextBtn.id = "next";
  nextBtn.textContent = "✅";
  nextBtn.addEventListener("pointerdown", function (e) {
    ensureAudio();
    if (ready && state === "painting") levelDone();
    e.stopPropagation();
  });

  function buildPalette() {
    paletteEl.innerHTML = "";
    COLORS.forEach(function (col, i) {
      var b = document.createElement("div");
      b.className = "pen" + (col === color ? " sel" : "");
      b.style.background = col;
      b.addEventListener("pointerdown", function (e) {
        ensureAudio();
        color = col;
        buildStamps();
        soundPop(i);
        var pens = paletteEl.querySelectorAll(".pen");
        for (var j = 0; j < pens.length; j++) pens[j].classList.remove("sel");
        b.classList.add("sel");
        e.stopPropagation();
      });
      paletteEl.appendChild(b);
    });
    if (!spongeBtn.parentNode) document.body.appendChild(spongeBtn);
    if (!nextBtn.parentNode) document.body.appendChild(nextBtn);
    updateSponge();
  }

  spongeBtn.addEventListener("pointerdown", function (e) {
    ensureAudio();
    soundSponge();
    poutCtx.save();
    poutCtx.setTransform(1, 0, 0, 1, 0, 0);
    poutCtx.clearRect(0, 0, paintOut.width, paintOut.height);
    poutCtx.restore();
    spongeCount++;
    overflow = 0;
    updateSponge();
    updateReady();
    e.stopPropagation();
  });

  // ---- Bölüm akışı ----
  function pickFigure() {
    var pool = FIGURES.filter(function (f) { return tier().pool === 0 ? f.pool === 0 : true; });
    var fresh = pool.filter(function (f) { return progress.seen.indexOf(f.id) < 0; });
    if (!fresh.length) { progress.seen = []; fresh = pool; }
    var pick = fresh[(Math.random() * fresh.length) | 0];
    progress.seen.push(pick.id);
    return pick;
  }

  function loadLevel() {
    fig = pickFigure();
    saveProgress();
    layoutFigure();
    pinCtx.save(); pinCtx.setTransform(1, 0, 0, 1, 0, 0);
    pinCtx.clearRect(0, 0, paintIn.width, paintIn.height); pinCtx.restore();
    poutCtx.save(); poutCtx.setTransform(1, 0, 0, 1, 0, 0);
    poutCtx.clearRect(0, 0, paintOut.width, paintOut.height); poutCtx.restore();
    buildMasks();
    coverage = 0; overflow = 0; peakOverflow = 0; spongeCount = 0;
    levelStart = performance.now();
    ready = false; readyAt = 0;
    nextBtn.classList.remove("show");
    state = "painting";
    strokes = {};
    levelBadge.textContent = "Bölüm " + progress.num;
    figureBadge.textContent = fig.emoji;
    updateSponge();
  }

  function levelDone() {
    state = "celebrating";
    scratchOff();
    strokes = {};
    nextBtn.classList.remove("show");
    spongeBtn.classList.remove("hint");
    popStart = performance.now();
    // Zorluk ölçüsü: figürü doldurmak ne kadar sürdü — sonrasındaki
    // serbest boyama süresi "zorlandı" sayılmamalı
    var sure = ((readyAt || performance.now()) - levelStart) / 1000;
    var ekstra = readyAt ? Math.round((performance.now() - readyAt) / 1000) : 0;
    var t = tier();
    var par = 45 + adapt.level * 10;
    adapt.record({
      hard: sure > par * 2.5 || spongeCount >= 4 || peakOverflow >= 0.30,
      smooth: sure <= par && spongeCount <= 1 &&
              peakOverflow <= (t.show === "none" ? 0.10 : 0.04),
      bolum: progress.num, figur: fig.id, sure: Math.round(sure),
      doluluk: Math.round(coverage * 100) / 100,
      tasma: Math.round(peakOverflow * 100) / 100,
      sunger: spongeCount, ekstra: ekstra
    });

    var isTrophy = progress.num % 10 === 0;
    setTimeout(function () {
      celebrateMsg.textContent = isTrophy ? "🏆" : "🎉";
      celebrateEl.classList.add("show");
      throwConfetti(isTrophy ? 44 : 26);
      if (isTrophy) soundTrophy(); else soundWin();
    }, 450);
    setTimeout(function () {
      celebrateEl.classList.remove("show");
      progress.num++;
      saveProgress();
      loadLevel();
    }, isTrophy ? 3600 : 2800);
  }

  var CONFETTI = ["🎉", "⭐", "🌈", "✨", "🖍️", "💛"];
  function throwConfetti(n) {
    for (var i = 0; i < n; i++) {
      var piece = document.createElement("div");
      piece.className = "confetti";
      piece.textContent = CONFETTI[(Math.random() * CONFETTI.length) | 0];
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.animationDuration = 1.6 + Math.random() * 1.6 + "s";
      piece.style.animationDelay = Math.random() * 0.5 + "s";
      document.body.appendChild(piece);
      (function (p) { setTimeout(function () { p.remove(); }, 4000); })(piece);
    }
  }

  // ---- Çizim ----
  function draw(now) {
    var sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#ffe0ec");
    sky.addColorStop(1, "#e3f2fd");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);
    if (!fig) return;

    // Kutlama "pop" animasyonu
    var pop = 1, rot = 0;
    var pt = (now - popStart) / 700;
    if (pt >= 0 && pt <= 1) {
      pop = 1 + Math.sin(Math.PI * pt) * 0.15;
      rot = Math.sin(Math.PI * pt * 2) * 0.05;
    }
    ctx.save();
    var cx = bbox.x + bbox.w / 2, cy = bbox.y + bbox.h / 2;
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.scale(pop, pop);
    ctx.translate(-cx, -cy);

    // Taşan boya (yalnız görünür kademelerde), figürün altında
    if (tier().show !== "none") {
      ctx.drawImage(paintOut, 0, 0, W, H);
    }

    // Figür içi kağıt + iç boya
    buildFigPath(ctx);
    ctx.fillStyle = "#fffdf8";
    ctx.fill();
    ctx.save();
    buildFigPath(ctx);
    ctx.clip();
    ctx.drawImage(paintIn, 0, 0, W, H);
    ctx.restore();

    // Kalın kontur (boya kenarını örter)
    buildFigPath(ctx);
    ctx.strokeStyle = "#2f2a28";
    ctx.lineWidth = outlineW;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.stroke();

    // Dekor (göz, benek — ölçüme girmez)
    if (fig.decor) {
      ctx.save();
      ctx.translate(figX, figY);
      ctx.scale(figS, figS);
      ctx.strokeStyle = "#2f2a28";
      ctx.lineWidth = (outlineW * 0.55) / figS;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      fig.decor(ctx);
      ctx.restore();
    }
    ctx.restore();
  }

  function tick(now) {
    var t = tier();
    // Taşan boyayı solduran kademeler
    if (t.show === "fade" && now - lastFade > FADE_MS) {
      lastFade = now;
      poutCtx.save();
      poutCtx.setTransform(1, 0, 0, 1, 0, 0);
      poutCtx.globalCompositeOperation = "destination-out";
      // t.fade ms sonunda ~%1'e insin: her tikte (1-a) ile çarpılır
      var a = 1 - Math.pow(0.01, FADE_MS / t.fade);
      poutCtx.fillStyle = "rgba(0,0,0," + a.toFixed(3) + ")";
      poutCtx.fillRect(0, 0, paintOut.width, paintOut.height);
      poutCtx.restore();
      dirty = true;
    }
    if (dirty && now - lastMeas > MEAS_MS) {
      lastMeas = now;
      dirty = false;
      measure();
    }
    draw(now);
    requestAnimationFrame(tick);
  }

  window.addEventListener("resize", resize);

  // Salt-okunur test kancası (oyun davranışını etkilemez)
  window.__boyamaDebug = {
    bbox: function () { return { x: bbox.x, y: bbox.y, w: bbox.w, h: bbox.h, brushR: brushR }; },
    coverage: function () { return coverage; },
    overflow: function () { return overflow; },
    state: function () { return state; },
    ready: function () { return ready; },
    tier: function () { return adapt.level; },
    figures: function () { return FIGURES; },
    measureNow: function () { measure(); return { coverage: coverage, overflow: overflow }; },
    // Sürtme sesinin gerçek çıkış seviyesi (parmak kalkınca susmalı)
    audioLevel: function (ms) {
      if (!audioCtx || !scratchGain) return Promise.resolve(-1);
      var an = audioCtx.createAnalyser();
      an.fftSize = 2048;
      scratchGain.connect(an);
      return new Promise(function (res) {
        setTimeout(function () {
          var buf = new Float32Array(an.fftSize);
          an.getFloatTimeDomainData(buf);
          var sum = 0;
          for (var i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
          scratchGain.disconnect(an);
          res(Math.sqrt(sum / buf.length));
        }, ms || 250);
      });
    }
  };

  buildStamps();
  buildPalette();
  resize();
  loadLevel();
  requestAnimationFrame(tick);
})();
</script>
