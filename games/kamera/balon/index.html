<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Balon Patlat 🎈</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    font-family: "Comic Sans MS", "Chalkboard SE", "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    background: #222;
  }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; }
  .home-btn {
    position: fixed;
    top: 2vh; left: 2vh;
    text-decoration: none;
    font-size: clamp(28px, 6vh, 44px);
    background: #fff;
    border-radius: 50%;
    width: clamp(52px, 11vh, 76px);
    height: clamp(52px, 11vh, 76px);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 5px 0 rgba(0,0,0,.15);
    z-index: 5;
  }
  .home-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .badge {
    position: fixed;
    top: 2vh;
    font-size: clamp(22px, 5vh, 40px);
    background: rgba(255,255,255,.9);
    border-radius: 20px;
    padding: 1vh 2.5vw;
    box-shadow: 0 5px 0 rgba(0,0,0,.12);
    z-index: 5;
    text-align: center;
  }
  #stars  { right: 2vh; }
  #goal   { right: 50%; transform: translateX(50%); }
  #celebrate {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,.55);
    z-index: 10;
  }
  #celebrate.show { display: flex; }
  #celebrate .msg {
    font-size: clamp(60px, 24vh, 160px);
    animation: bounce .6s infinite alternate;
  }
  @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.25); } }
  .confetti {
    position: fixed;
    top: -5vh;
    font-size: clamp(20px, 5vh, 36px);
    animation: fall linear forwards;
    z-index: 11;
    pointer-events: none;
  }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }
</style>
</head>
<body>
  <a class="home-btn" href="../index.html">🏠</a>
  <div class="badge" id="goal">🎈 <span id="goal-count">0</span></div>
  <div class="badge" id="stars">⭐ <span id="star-count">0</span></div>
  <canvas id="game"></canvas>
  <div id="celebrate"><div class="msg">🎉</div></div>

<script src="../../shared/adapt.js"></script>
<script src="../../shared/kamera.js"></script>
<script>
(function () {
  "use strict";

  if (!window.KemalAdapt) {
    // Paylaşılan modül yüklenemezse basit yedek (kalıcı kayıt tutmaz)
    window.KemalAdapt = { create: function (g, o) {
      var lvl = o.start || 0;
      var streak = 0;
      return { get level() { return lvl; }, record: function (r) {
        if (r.hard) { lvl = Math.max(o.min, lvl - 1); streak = 0; }
        else if (r.smooth && ++streak >= (o.streak || 2)) { lvl = Math.min(o.max, lvl + 1); streak = 0; }
        else if (!r.smooth) streak = 0;
        return lvl;
      } };
    } };
  }
  if (!window.KemalKamera) {
    // Kamera modülü yüklenemedi: boş sayfa yerine sevimli bir çıkış
    document.body.innerHTML =
      '<a class="home-btn" href="../index.html">🏠</a>' +
      '<div style="height:100%;display:flex;align-items:center;justify-content:center;font-size:20vh">😴</div>';
    return;
  }

  // Kademeler: balon = eşzamanlı balon, boy = çap (min(W,H) oranı),
  // hedef = turda patlatılacak sayı, hiz = yukarı süzülme (ekran boyu/sn),
  // esik = patlatmak için gereken hareket şiddeti (bilinçli dokunuş istensin)
  var TIERS = /*TIERS_START*/[
    {"balon":1,"boy":0.30,"hedef":5, "hiz":0,   "esik":0.25},
    {"balon":2,"boy":0.26,"hedef":6, "hiz":0,   "esik":0.25},
    {"balon":2,"boy":0.22,"hedef":7, "hiz":0.02,"esik":0.30},
    {"balon":3,"boy":0.20,"hedef":8, "hiz":0.03,"esik":0.30},
    {"balon":3,"boy":0.17,"hedef":9, "hiz":0.05,"esik":0.35},
    {"balon":4,"boy":0.15,"hedef":10,"hiz":0.06,"esik":0.35}
  ]/*TIERS_END*/;

  var adapt = window.KemalAdapt.create("kamera-balon", { min: 0, max: TIERS.length - 1, start: 0, streak: 2 });

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var starCountEl = document.getElementById("star-count");
  var goalCountEl = document.getElementById("goal-count");
  var celebrateEl = document.getElementById("celebrate");

  var W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // --- Sesler ---
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function beep(freq, dur, type, delay) {
    if (!audioCtx) return;
    var t = audioCtx.currentTime + (delay || 0);
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.22, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur);
  }
  function soundPop() { beep(520, 0.08, "triangle"); beep(1040, 0.15, "sine", 0.05); }
  function soundWin() { [523, 659, 784, 1047].forEach(function (f, i) { beep(f, 0.25, "sine", i * 0.15); }); }
  document.addEventListener("pointerdown", ensureAudio);

  // Arka planda geçen süre zorluk ölçümüne sayılmasın
  var hiddenAt = 0;
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) hiddenAt = performance.now();
    else if (hiddenAt) { roundStart += performance.now() - hiddenAt; hiddenAt = 0; }
  });

  // --- Oyun durumu ---
  var cam = null, motion = null;
  var playing = false;
  var balloons = [];    // {x, y: video-normalize 0..1, hue, wob, born, hits}
  var particles = [];   // {x, y: ekran px, vx, vy, life, emoji}
  var stars = 0;
  var popped = 0;
  var tier = TIERS[adapt.level];
  var roundStart = 0;
  var patlatmalar = [];         // balon başına patlatma süresi (kalibrasyon)
  var hareketSum = 0, hareketN = 0;   // tur boyunca ortalama hareket şiddeti

  var COLORS = [0, 30, 55, 120, 200, 260, 320];   // ton (hue) paleti

  function balloonPx() { return tier.boy * Math.min(W, H) / 2; }   // yarıçap px

  function spawnBalloon() {
    balloons.push({
      x: 0.1 + Math.random() * 0.8,
      y: 0.2 + Math.random() * 0.65,
      hue: COLORS[Math.floor(Math.random() * COLORS.length)],
      wob: Math.random() * Math.PI * 2,
      born: performance.now(),
      hits: 0
    });
  }

  function newRound() {
    tier = TIERS[adapt.level];
    popped = 0;
    patlatmalar = [];
    hareketSum = 0; hareketN = 0;
    balloons = [];
    for (var i = 0; i < tier.balon; i++) spawnBalloon();
    goalCountEl.textContent = popped + "/" + tier.hedef;
    roundStart = performance.now();
    playing = true;
  }

  function popBalloon(b, idx) {
    // Aynı karede iki balon patlayabiliyordu; ikincisi winRound'u tekrar
    // çağırıp turu iki kez kaydediyor ve kademeyi iki kez ilerletiyordu
    // (telemetride t'si milisaniyesine kadar aynı olan çift kayıt bundan).
    if (!playing) return;
    patlatmalar.push(Math.round((performance.now() - b.born) / 100) / 10);
    balloons.splice(idx, 1);
    var cov = window.KemalKamera.cover(cam.video, W, H);
    burst(cov.sx(b.x), cov.sy(b.y), "✨", 8);
    soundPop();
    stars++;
    popped++;
    starCountEl.textContent = stars;
    goalCountEl.textContent = Math.min(popped, tier.hedef) + "/" + tier.hedef;
    if (popped >= tier.hedef) {
      winRound();
    } else if (balloons.length < tier.balon) {
      setTimeout(function () {
        if (playing && balloons.length < tier.balon) spawnBalloon();
      }, 500);
    }
  }

  function winRound() {
    playing = false;
    var sure = (performance.now() - roundStart) / 1000;
    var ortPatlatma = sure / Math.max(1, tier.hedef);
    adapt.record({
      hard: ortPatlatma > 8,
      smooth: ortPatlatma < 4,
      sure: Math.round(sure),
      ortPatlatma: Math.round(ortPatlatma * 10) / 10,
      hedef: tier.hedef,
      esik: tier.esik,
      patlatmalar: patlatmalar,
      ortHareket: hareketN ? Math.round(hareketSum / hareketN * 100) / 100 : 0
    });
    soundWin();
    celebrateEl.classList.add("show");
    throwConfetti();
    setTimeout(function () {
      celebrateEl.classList.remove("show");
      newRound();
    }, 2600);
  }

  function burst(x, y, emoji, n) {
    for (var i = 0; i < n; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 500,
        vy: -Math.random() * 400 - 100,
        life: 0.9,
        emoji: emoji
      });
    }
  }

  var CONFETTI = ["🎉","⭐","🎈","✨","💛","🧡"];
  function throwConfetti() {
    for (var i = 0; i < 26; i++) {
      var piece = document.createElement("div");
      piece.className = "confetti";
      piece.textContent = CONFETTI[Math.floor(Math.random() * CONFETTI.length)];
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.animationDuration = 1.6 + Math.random() * 1.6 + "s";
      piece.style.animationDelay = Math.random() * 0.5 + "s";
      document.body.appendChild(piece);
      (function (p) { setTimeout(function () { p.remove(); }, 4000); })(piece);
    }
  }

  function update(dt, now) {
    if (!playing || !motion) return;

    var newData = motion.sample(now);
    if (newData) { hareketSum += motion.global; hareketN++; }
    var cov = window.KemalKamera.cover(cam.video, W, H);
    var rPx = balloonPx();

    for (var i = balloons.length - 1; i >= 0; i--) {
      var b = balloons[i];
      var age = (now - b.born) / 1000;

      // Süzülme (üstten çıkan alta sarar) + salınım
      b.y -= tier.hiz * dt * (H / Math.max(1, cov.sy(1) - cov.sy(0)));
      if (b.y < 0.08) b.y = 0.95;
      b.wob += dt * 2;

      // 15 sn dokunulmayan balon sallanır ve BÜYÜR — kaybetmek yok,
      // oyun kendini kolaylaştırır
      var grow = age > 15 ? Math.min(1.5, 1 + (age - 15) * 0.05) : 1;
      b.grow = grow;

      if (newData) {
        // r01 dikey birimde: yarıçapı görünen video yüksekliğine oranla
        var r01 = (rPx * grow * 1.2) / (cov.sy(1) - cov.sy(0));
        var act = motion.activityAt(b.x, b.y, r01);
        if (act > tier.esik) {
          b.hits++;
          if (b.hits >= 3) { popBalloon(b, i); continue; }   // ~200 ms kararlı hareket
        } else {
          b.hits = 0;
        }
      }
    }

    particles.forEach(function (p) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 900 * dt;
      p.life -= dt;
    });
    particles = particles.filter(function (p) { return p.life > 0; });
  }

  function drawBalloon(b, now) {
    var cov = window.KemalKamera.cover(cam.video, W, H);
    var r = balloonPx() * (b.grow || 1);
    var wobble = (b.grow > 1 ? 12 : 5) * Math.sin(b.wob * (b.grow > 1 ? 3 : 1));
    var x = cov.sx(b.x) + wobble;
    var y = cov.sy(b.y);

    // İp
    ctx.strokeStyle = "rgba(255,255,255,.8)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, y + r * 0.95);
    ctx.quadraticCurveTo(x + 10, y + r * 1.5, x - 6, y + r * 2);
    ctx.stroke();

    // Gövde
    var g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
    g.addColorStop(0, "hsl(" + b.hue + ", 95%, 78%)");
    g.addColorStop(1, "hsl(" + b.hue + ", 85%, 55%)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(x, y, r * 0.85, r, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.9)";
    ctx.lineWidth = 4;
    ctx.stroke();

    // Düğüm
    ctx.fillStyle = "hsl(" + b.hue + ", 85%, 50%)";
    ctx.beginPath();
    ctx.moveTo(x, y + r * 0.92);
    ctx.lineTo(x - r * 0.12, y + r * 1.08);
    ctx.lineTo(x + r * 0.12, y + r * 1.08);
    ctx.closePath();
    ctx.fill();

    // Parlama
    ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.beginPath();
    ctx.ellipse(x - r * 0.3, y - r * 0.4, r * 0.18, r * 0.28, -0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    if (!playing) return;
    balloons.forEach(function (b) { drawBalloon(b, now); });
    particles.forEach(function (p) {
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.font = Math.min(W, H) * 0.06 + "px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(p.emoji, p.x, p.y);
      ctx.globalAlpha = 1;
    });
  }

  var lastTime = 0;
  function loop(t) {
    var dt = Math.min((t - lastTime) / 1000, 0.05);
    lastTime = t;
    update(dt, t);
    draw(t);
    requestAnimationFrame(loop);
  }

  // --- Başlat: kamera → ısınma → oyun ---
  window.KemalKamera.start().then(function (c) {
    cam = c;
    motion = window.KemalKamera.createMotion(cam.video);
    return window.KemalKamera.warmup(cam.video, motion, { beep: beep });
  }).then(function () {
    newRound();
    requestAnimationFrame(function (t) { lastTime = t; requestAnimationFrame(loop); });
  });

  // Test kancası (tools/smoke-kamera.mjs kullanır)
  window.__kameraDebug = {
    skipWarmup: function () { if (window.KemalKamera._skipWarmup) window.KemalKamera._skipWarmup(); },
    motionGlobal: function () { return motion ? motion.global : -1; },
    playing: function () { return playing; },
    balloons: function () { return balloons.length; },
    stars: function () { return stars; },
    forcePop: function () {
      if (!playing) return;
      if (!balloons.length) spawnBalloon();   // yeniden doğum 500 ms bekler; test beklemesin
      popBalloon(balloons[0], 0);
    },
    finishRound: function () {
      while (playing && popped < tier.hedef) popBalloon(balloons[0] || (spawnBalloon(), balloons[0]), 0);
    }
  };
})();
</script>
</body>
</html>
