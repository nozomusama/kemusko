<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Yılan Kurtarma 🐍</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    touch-action: none;
    font-family: "Comic Sans MS", "Chalkboard SE", "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    background: #7ec8ff;
  }
  #game { display: block; width: 100vw; height: 100vh; }
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2vh 3vw;
    z-index: 5;
    pointer-events: none;
  }
  header > * { pointer-events: auto; }
  .home-btn {
    text-decoration: none;
    font-size: clamp(28px, 8vw, 44px);
    background: #fff;
    border-radius: 50%;
    width: clamp(52px, 14vw, 76px);
    height: clamp(52px, 14vw, 76px);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 5px 0 rgba(0,0,0,.15);
  }
  .home-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .badge {
    font-size: clamp(20px, 5.5vw, 32px);
    font-weight: bold;
    color: #444;
    background: #fff;
    border-radius: 20px;
    padding: 1vh 4vw;
    box-shadow: 0 5px 0 rgba(0,0,0,.15);
  }
  #celebrate {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,.5);
    z-index: 10;
    pointer-events: none;
  }
  #celebrate.show { display: flex; }
  #celebrate .msg {
    font-size: clamp(70px, 24vw, 150px);
    animation: bounce .6s infinite alternate;
  }
  @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.25); } }
  .confetti {
    position: fixed;
    top: -5vh;
    font-size: clamp(20px, 6vw, 36px);
    animation: fall linear forwards;
    z-index: 11;
    pointer-events: none;
  }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }
</style>
</head>
<body>
  <header>
    <a class="home-btn" href="../../index.html">🏠</a>
    <div class="badge" id="level-badge">Bölüm 1</div>
    <div class="badge" id="left-badge">🐍 0</div>
  </header>
  <canvas id="game"></canvas>
  <div id="celebrate"><div class="msg">🎉</div></div>

<script src="../shared/adapt.js"></script>
<script>
(function () {
  "use strict";

  // Bölümler: her yılan baştan kuyruğa hücre listesi [x,y].
  // Baş yönü = ilk iki hücrenin farkı. Dokununca yılan baş yönünde düz
  // kayarak tahtadan çıkar; yol başka bir yılanla kapalıysa çıkamaz.
  // Bir yılanı kurtarmak yolları yalnızca AÇAR, bu yüzden hiçbir dokunma
  // sırası oyunu kilitleyemez. Tüm bölümler tools/verify-levels.mjs ile
  // çözülebilirliği kanıtlanarak üretildi.
  var LEVELS = /*LEVELS_START*/[{"w":4,"h":4,"snakes":[[[2,1],[1,1],[0,1]]]},{"w":4,"h":4,"snakes":[[[1,1],[1,2],[1,3]],[[3,2],[2,2],[2,3]]]},{"w":4,"h":4,"snakes":[[[1,1],[1,2],[1,3]],[[2,2],[3,2],[3,3]]]},{"w":5,"h":5,"snakes":[[[2,1],[2,2],[2,3]],[[1,2],[0,2],[0,1]],[[1,3],[1,4],[2,4]]]},{"w":5,"h":5,"snakes":[[[4,3],[4,2],[3,2],[3,3]],[[2,1],[3,1],[3,0]],[[1,1],[1,2],[1,3]],[[0,2],[0,1],[0,0]]]},{"w":5,"h":5,"snakes":[[[0,1],[0,0],[1,0]],[[2,3],[2,2],[2,1]],[[4,0],[3,0],[2,0]],[[3,4],[2,4],[1,4],[1,3]],[[3,2],[3,1],[4,1]]]},{"w":5,"h":6,"snakes":[[[3,2],[4,2],[4,3],[4,4]],[[1,1],[1,2],[0,2],[0,3]],[[2,2],[2,1],[3,1],[4,1]],[[3,5],[3,4],[2,4]],[[1,3],[1,4],[1,5]]]},{"w":5,"h":6,"snakes":[[[2,0],[1,0],[0,0]],[[0,4],[1,4],[1,5],[0,5]],[[1,2],[2,2],[2,3],[2,4],[3,4]],[[4,0],[3,0],[3,1]],[[0,2],[0,1],[1,1],[2,1]],[[3,2],[3,3],[4,3],[4,4]]]},{"w":6,"h":6,"snakes":[[[2,5],[3,5],[4,5]],[[1,0],[1,1],[1,2]],[[0,4],[0,5],[1,5]],[[3,1],[4,1],[4,0]],[[4,3],[4,2],[3,2],[2,2],[2,1]],[[3,3],[2,3],[2,4],[3,4]]]},{"w":6,"h":6,"snakes":[[[3,0],[4,0],[5,0]],[[2,5],[3,5],[3,4],[2,4],[1,4]],[[1,3],[1,2],[1,1],[2,1]],[[3,2],[2,2],[2,3]],[[0,2],[0,3],[0,4],[0,5],[1,5]],[[4,2],[4,3],[4,4],[4,5]],[[5,2],[5,3],[5,4],[5,5]]]},{"w":6,"h":7,"snakes":[[[1,2],[1,3],[1,4],[0,4],[0,5],[0,6]],[[2,1],[3,1],[3,0]],[[4,4],[5,4],[5,5]],[[2,2],[2,3],[2,4],[2,5],[1,5],[1,6]],[[0,3],[0,2],[0,1],[0,0]],[[5,0],[4,0],[4,1]],[[3,2],[4,2],[4,3],[5,3],[5,2]]]},{"w":6,"h":7,"snakes":[[[0,3],[0,4],[0,5],[0,6],[1,6]],[[5,0],[4,0],[4,1],[5,1]],[[3,3],[4,3],[5,3],[5,2]],[[2,4],[2,3],[2,2],[3,2],[3,1],[3,0]],[[1,5],[2,5],[3,5]],[[3,4],[4,4],[4,5]],[[1,1],[1,0],[2,0],[2,1]],[[5,5],[5,6],[4,6]]]}]/*LEVELS_END*/;

  var PALETTE = ["#ef5350", "#ff9800", "#fbc02d", "#66bb6a", "#42a5f5", "#ab47bc", "#ec407a", "#26c6da"];

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var levelBadge = document.getElementById("level-badge");
  var leftBadge = document.getElementById("left-badge");
  var celebrateEl = document.getElementById("celebrate");
  var celebrateMsg = celebrateEl.querySelector(".msg");

  var W = 0, H = 0, DPR = 1;
  var headerH = 0;
  var board = { x: 0, y: 0, cell: 40, gw: 4, gh: 4 };

  var snakes = [];
  var transitioning = false;
  var curLevel = null;
  var bumps = 0;
  var levelStart = 0;

  /*GEN_START*/
  // Oyun içi bölüm üretici + çözücü — tools/verify-levels.mjs ile aynı
  // kurallar. Bir yılanı kurtarmak hücreleri yalnızca boşalttığından
  // açgözlü çözücü eksiksizdir: kabul edilen her bölüm, hangi sırayla
  // denenirse denensin çözülebilir.
  function heading(cells) {
    return [cells[0][0] - cells[1][0], cells[0][1] - cells[1][1]];
  }
  function genKey(x, y) { return x + "," + y; }
  function genEscapePath(cells, W, H) {
    var d = heading(cells);
    var out = [];
    var x = cells[0][0] + d[0], y = cells[0][1] + d[1];
    while (x >= 0 && x < W && y >= 0 && y < H) { out.push([x, y]); x += d[0]; y += d[1]; }
    return out;
  }
  function genSelfCross(cells, W, H) {
    var own = {};
    cells.forEach(function (c) { own[genKey(c[0], c[1])] = 1; });
    return genEscapePath(cells, W, H).some(function (c) { return own[genKey(c[0], c[1])]; });
  }
  // Çözülebilirse kurtarma dalgası sayısını, değilse -1 döndürür
  function genSolve(snakesArr, W, H) {
    var remaining = snakesArr.slice();
    var rounds = 0;
    while (remaining.length) {
      var occ = {};
      remaining.forEach(function (s) { s.forEach(function (c) { occ[genKey(c[0], c[1])] = 1; }); });
      var freed = remaining.filter(function (s) {
        var own = {};
        s.forEach(function (c) { own[genKey(c[0], c[1])] = 1; });
        return genEscapePath(s, W, H).every(function (c) {
          var k = genKey(c[0], c[1]);
          return !occ[k] || own[k];
        });
      });
      if (!freed.length) return -1;
      remaining = remaining.filter(function (s) { return freed.indexOf(s) < 0; });
      rounds++;
    }
    return rounds;
  }
  var GEN_DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  function genSnakeWalk(W, H, occ, len, rand) {
    for (var attempt = 0; attempt < 40; attempt++) {
      var sx = Math.floor(rand() * W), sy = Math.floor(rand() * H);
      if (occ[genKey(sx, sy)]) continue;
      var cells = [[sx, sy]];
      var used = {};
      used[genKey(sx, sy)] = 1;
      while (cells.length < len) {
        var last = cells[cells.length - 1];
        var opts = GEN_DIRS.map(function (d) { return [last[0] + d[0], last[1] + d[1]]; })
          .filter(function (c) {
            return c[0] >= 0 && c[0] < W && c[1] >= 0 && c[1] < H &&
                   !occ[genKey(c[0], c[1])] && !used[genKey(c[0], c[1])];
          });
        if (!opts.length) break;
        var nxt = opts[Math.floor(rand() * opts.length)];
        cells.push(nxt);
        used[genKey(nxt[0], nxt[1])] = 1;
      }
      if (cells.length < 3) continue;
      var cand = rand() < 0.5 ? [cells, cells.slice().reverse()] : [cells.slice().reverse(), cells];
      for (var i = 0; i < cand.length; i++) {
        if (!genSelfCross(cand[i], W, H)) return cand[i];
      }
    }
    return null;
  }
  function generateLevel(p, rand) {
    rand = rand || Math.random;
    for (var pass = 0; pass < 2; pass++) {
      var needDepth = pass === 0 ? p.minDepth : 1;  // ikinci geçişte derinlik şartı gevşer
      for (var t = 0; t < 400; t++) {
        var occ = {};
        var snakesArr = [];
        var ok = true;
        for (var i = 0; i < p.n; i++) {
          var len = p.minLen + Math.floor(rand() * (p.maxLen - p.minLen + 1));
          var s = genSnakeWalk(p.w, p.h, occ, len, rand);
          if (!s) { ok = false; break; }
          s.forEach(function (c) { occ[genKey(c[0], c[1])] = 1; });
          snakesArr.push(s);
        }
        if (!ok) continue;
        var rounds = genSolve(snakesArr, p.w, p.h);
        if (rounds >= needDepth) return { w: p.w, h: p.h, snakes: snakesArr };
      }
    }
    return null;
  }
  /*GEN_END*/

  // Zorluk kademeleri — uyarlanabilir sistem bölümleri bu tablodan üretir
  var TIERS = /*TIERS_START*/[{"w":4,"h":4,"n":1,"minLen":3,"maxLen":3,"minDepth":1},{"w":4,"h":4,"n":2,"minLen":3,"maxLen":3,"minDepth":1},{"w":4,"h":4,"n":2,"minLen":3,"maxLen":4,"minDepth":2},{"w":5,"h":5,"n":3,"minLen":3,"maxLen":4,"minDepth":2},{"w":5,"h":5,"n":4,"minLen":3,"maxLen":4,"minDepth":2},{"w":5,"h":5,"n":5,"minLen":3,"maxLen":4,"minDepth":2},{"w":5,"h":6,"n":5,"minLen":3,"maxLen":5,"minDepth":3},{"w":5,"h":6,"n":6,"minLen":3,"maxLen":5,"minDepth":3},{"w":6,"h":6,"n":6,"minLen":3,"maxLen":5,"minDepth":3},{"w":6,"h":6,"n":7,"minLen":3,"maxLen":5,"minDepth":3},{"w":6,"h":7,"n":7,"minLen":3,"maxLen":6,"minDepth":4},{"w":6,"h":7,"n":8,"minLen":3,"maxLen":6,"minDepth":4}]/*TIERS_END*/;

  if (!window.KemalAdapt) {
    // Paylaşılan modül yüklenemezse basit yedek (kalıcı kayıt tutmaz)
    window.KemalAdapt = { create: function (g, o) {
      var lvl = o.start || 0;
      var streak = 0;
      return { get level() { return lvl; }, record: function (r) {
        if (r.hard) { lvl = Math.max(o.min, lvl - 1); streak = 0; }
        else if (r.smooth && ++streak >= (o.streak || 2)) { lvl = Math.min(o.max, lvl + 1); streak = 0; }
        else if (!r.smooth) streak = 0;
        return lvl;
      } };
    } };
  }

  // Eski kayıt biçiminden geçiş + ilerleme durumu
  var progress = null;
  var startTier = 0;
  try {
    progress = JSON.parse(localStorage.getItem("yilan-progress2") || "null");
    if (!progress) {
      var old = JSON.parse(localStorage.getItem("yilan-progress") || "null");
      if (old && typeof old.lvl === "number") {
        startTier = Math.max(0, Math.min(TIERS.length - 1, old.lvl));
        progress = { num: (old.lap || 0) * 12 + old.lvl + 1, seen: [] };
      }
    }
  } catch (e) { /* localStorage kapalıysa baştan başla */ }
  if (!progress || typeof progress.num !== "number" || !Array.isArray(progress.seen)) {
    progress = { num: 1, seen: [] };
  }
  var adapt = window.KemalAdapt.create("yilan", { min: 0, max: TIERS.length - 1, start: startTier, streak: 2 });

  function saveProgress() {
    try { localStorage.setItem("yilan-progress2", JSON.stringify(progress)); } catch (e) {}
  }

  // İlk kez ulaşılan kademede el yapımı bölüm; sonrasında cihazda taze üretim
  function getNextLevel() {
    var tier = adapt.level;
    if (progress.seen.indexOf(tier) < 0 && LEVELS[tier]) {
      progress.seen.push(tier);
      saveProgress();
      return LEVELS[tier];
    }
    return generateLevel(TIERS[tier]) || LEVELS[Math.min(tier, LEVELS.length - 1)];
  }

  // --- Sesler ---
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function beep(freq, dur, type, delay) {
    if (!audioCtx) return;
    var t = audioCtx.currentTime + (delay || 0);
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.22, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur);
  }
  function soundSlither() {
    if (!audioCtx) return;
    var t = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(700, t);
    osc.frequency.linearRampToValueAtTime(250, t + 0.35);
    gain.gain.setValueAtTime(0.18, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.4);
  }
  function soundPop(n)   { beep(660 + n * 90, 0.18, "sine"); }
  function soundBump()   { beep(150, 0.25, "sawtooth"); }
  function soundWin()    { [523, 659, 784, 1047].forEach(function (f, i) { beep(f, 0.25, "sine", i * 0.14); }); }
  function soundTrophy() { [523, 659, 784, 1047, 784, 1047, 1319].forEach(function (f, i) { beep(f, 0.24, "sine", i * 0.13); }); }
  document.addEventListener("pointerdown", ensureAudio);

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    // CSS boyutunu piksel olarak sabitle: 100vh mobilde adres çubuğu gizliyken
    // ölçülen yüksekliği verir ve canvas gerilerek dokunma noktası kayardı
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    headerH = Math.min(Math.max(52, W * 0.14), 76) + H * 0.04;
    layoutBoard();
    snakes.forEach(function (s) { rebuildPath(s); });
  }

  function layoutBoard() {
    if (!curLevel) return;
    var lv = curLevel;
    board.gw = lv.w;
    board.gh = lv.h;
    var pad = Math.min(W, H) * 0.045;
    var availW = W - pad * 2;
    var availH = H - headerH - pad * 2.2;
    board.cell = Math.floor(Math.min(availW / lv.w, availH / lv.h));
    board.x = (W - board.cell * lv.w) / 2;
    board.y = headerH + (availH - board.cell * lv.h) / 2 + pad;
  }

  function center(cx, cy) {
    return { x: board.x + (cx + 0.5) * board.cell, y: board.y + (cy + 0.5) * board.cell };
  }

  // Kuyruk→baş noktaları + baş yönünde ekranın dışına kadar uzatma.
  // Tüm parçalar hücre boyunda olduğundan yay uzunluğu = indeks * hücre.
  function rebuildPath(s) {
    var pts = [];
    for (var i = s.cells.length - 1; i >= 0; i--) {
      var c = center(s.cells[i][0], s.cells[i][1]);
      pts.push(c);
    }
    var dir = heading(s.cells);
    var last = pts[pts.length - 1];
    var margin = (s.cells.length + 2) * board.cell;
    var k = 1;
    while (true) {
      var p = { x: last.x + dir[0] * k * board.cell, y: last.y + dir[1] * k * board.cell };
      pts.push(p);
      if (p.x < -margin || p.x > W + margin || p.y < -margin || p.y > H + margin) break;
      k++;
    }
    s.pts = pts;
    s.bodyArc = (s.cells.length - 1) * board.cell;
    s.lastArc = (pts.length - 1) * board.cell;
  }

  function pointAt(s, arc) {
    var cell = board.cell;
    var maxArc = s.lastArc;
    if (arc <= 0) arc = 0;
    if (arc >= maxArc) arc = maxArc;
    var i = Math.min(Math.floor(arc / cell), s.pts.length - 2);
    var f = arc / cell - i;
    var a = s.pts[i], b = s.pts[i + 1];
    return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f, dx: (b.x - a.x) / cell, dy: (b.y - a.y) / cell };
  }

  function loadLevel() {
    curLevel = getNextLevel();
    layoutBoard();
    bumps = 0;
    levelStart = performance.now();
    snakes = curLevel.snakes.map(function (cells, i) {
      var s = {
        cells: cells,
        color: PALETTE[(i + progress.num) % PALETTE.length],
        phase: i * 1.7,
        state: "idle",   // idle | escaping | gone
        p: 0,            // kaçış ilerlemesi (piksel yayı)
        bumpStart: -1e9,
        flashUntil: 0,
        popIdx: 0
      };
      rebuildPath(s);
      return s;
    });
    transitioning = false;
    levelBadge.textContent = "Bölüm " + progress.num;
    updateLeft();
  }

  function updateLeft() {
    var left = snakes.filter(function (s) { return s.state !== "gone"; }).length;
    leftBadge.textContent = "🐍 " + left;
  }

  function cellKey(x, y) { return x + "," + y; }

  function escapeCells(s) {
    return genEscapePath(s.cells, curLevel.w, curLevel.h);
  }

  // Kaçmakta olan yılanın ANLIK olarak işgal ettiği hücreler. Yılan ilerledikçe
  // arkasındaki hücreler serbest kalır; böylece önü açılan yılan hemen hareket
  // edebilir, kaçanın ekrandan tamamen çıkması beklenmez. Kuyruğun bulunduğu
  // hücre tam terk edilene kadar dolu sayılır (üst üste binme olmaz).
  function occupiedCells(s) {
    if (s.state !== "escaping") return s.cells;
    var n = s.cells.length;
    var adv = Math.floor(s.p / board.cell);   // kaç tam hücre ilerledi
    var dir = heading(s.cells);
    var out = [];
    for (var i = adv; i < adv + n; i++) {
      var c = i < n
        ? s.cells[n - 1 - i]                  // gövde: kuyruktan başa
        : [s.cells[0][0] + dir[0] * (i - n + 1),
           s.cells[0][1] + dir[1] * (i - n + 1)];   // baş: kaçış hattında
      if (c[0] >= 0 && c[0] < curLevel.w && c[1] >= 0 && c[1] < curLevel.h) out.push(c);
    }
    return out;
  }

  // Tahtada hâlâ yer kaplayan her yılan yolu kapatır.
  function findBlocker(s) {
    var occ = {};
    snakes.forEach(function (o) {
      if (o === s || o.state === "gone") return;
      occupiedCells(o).forEach(function (c) { occ[cellKey(c[0], c[1])] = o; });
    });
    var path = escapeCells(s);
    for (var i = 0; i < path.length; i++) {
      var hit = occ[cellKey(path[i][0], path[i][1])];
      if (hit) return hit;
    }
    return null;
  }

  function tapSnake(s) {
    if (s.state !== "idle" || transitioning) return;
    var blocker = findBlocker(s);
    var now = performance.now();
    if (blocker) {
      bumps++;
      s.bumpStart = now;
      blocker.flashUntil = now + 900;
      soundBump();
    } else {
      s.state = "escaping";
      s.p = 0;
      s.popIdx = snakes.filter(function (o) { return o.state === "gone"; }).length;
      soundSlither();
    }
  }

  function onTap(px, py) {
    ensureAudio();
    if (transitioning) return;
    // Önce hücre isabeti, olmazsa en yakın gövde noktası (cömert dokunma alanı)
    var gx = Math.floor((px - board.x) / board.cell);
    var gy = Math.floor((py - board.y) / board.cell);
    var target = null;
    for (var i = 0; i < snakes.length; i++) {
      var s = snakes[i];
      if (s.state !== "idle") continue;
      if (s.cells.some(function (c) { return c[0] === gx && c[1] === gy; })) { target = s; break; }
    }
    if (!target) {
      var best = board.cell * 0.75, bestS = null;
      snakes.forEach(function (s) {
        if (s.state !== "idle") return;
        s.cells.forEach(function (c) {
          var p = center(c[0], c[1]);
          var d = Math.hypot(p.x - px, p.y - py);
          if (d < best) { best = d; bestS = s; }
        });
      });
      target = bestS;
    }
    if (target) tapSnake(target);
  }

  canvas.addEventListener("pointerdown", function (e) {
    // Dokunma noktasını canvas'ın gerçek yerleşimine göre çevir
    var r = canvas.getBoundingClientRect();
    onTap((e.clientX - r.left) * (W / (r.width || W)),
          (e.clientY - r.top) * (H / (r.height || H)));
  });

  function update(dt) {
    var anyGoneNow = false;
    snakes.forEach(function (s) {
      if (s.state !== "escaping") return;
      // Hızlanarak kay: 4 → 12 hücre/sn
      var t = Math.min(s.p / (board.cell * 2), 1);
      var speed = (4 + 8 * t) * board.cell;
      s.p += speed * dt;
      if (s.p >= s.lastArc) {
        s.state = "gone";
        anyGoneNow = true;
        soundPop(s.popIdx);
      }
    });
    if (anyGoneNow) {
      updateLeft();
      if (snakes.every(function (s) { return s.state === "gone"; })) levelClear();
    }
  }

  function levelClear() {
    transitioning = true;
    var dur = (performance.now() - levelStart) / 1000;
    var n = snakes.length;
    var par = 6 + n * 7;   // kaba hedef süre (sn)
    adapt.record({
      hard: bumps >= n * 2 + 3 || dur > par * 2.5,
      smooth: bumps <= Math.ceil(n / 2) && dur <= par,
      bolum: progress.num, yilan: n, carpma: bumps, sure: Math.round(dur)
    });
    var isTrophy = progress.num % 12 === 0;
    celebrateMsg.textContent = isTrophy ? "🏆" : "🎉";
    celebrateEl.classList.add("show");
    throwConfetti(isTrophy ? 44 : 26);
    if (isTrophy) soundTrophy(); else soundWin();
    setTimeout(function () {
      celebrateEl.classList.remove("show");
      progress.num++;
      saveProgress();
      loadLevel();
    }, isTrophy ? 3400 : 2400);
  }

  var CONFETTI = ["🎉", "⭐", "🎈", "✨", "💚", "🐍"];
  function throwConfetti(n) {
    for (var i = 0; i < n; i++) {
      var piece = document.createElement("div");
      piece.className = "confetti";
      piece.textContent = CONFETTI[Math.floor(Math.random() * CONFETTI.length)];
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.animationDuration = 1.6 + Math.random() * 1.6 + "s";
      piece.style.animationDelay = Math.random() * 0.5 + "s";
      document.body.appendChild(piece);
      (function (p) { setTimeout(function () { p.remove(); }, 4000); })(piece);
    }
  }

  // --- Çizim ---
  function shade(hex, f) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    r = Math.round(Math.min(255, r * f)); g = Math.round(Math.min(255, g * f)); b = Math.round(Math.min(255, b * f));
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  function drawBoard() {
    var lv = curLevel;
    var r = board.cell * 0.3;
    ctx.fillStyle = "rgba(255,255,255,.55)";
    roundRect(board.x - board.cell * 0.15, board.y - board.cell * 0.15,
              board.cell * lv.w + board.cell * 0.3, board.cell * lv.h + board.cell * 0.3, r);
    ctx.fill();
    ctx.fillStyle = "rgba(80,120,160,.14)";
    for (var y = 0; y < lv.h; y++) {
      for (var x = 0; x < lv.w; x++) {
        var c = center(x, y);
        ctx.beginPath();
        ctx.arc(c.x, c.y, board.cell * 0.055, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawSnake(s, now) {
    if (s.state === "gone") return;
    var cell = board.cell;
    var w = cell * 0.6;
    var headArc = s.bodyArc + (s.state === "escaping" ? s.p : 0);
    var tailArc = headArc - s.bodyArc;

    // Çarpma animasyonu: baş yönünde kısa itiş
    var bump = 0;
    var bt = (now - s.bumpStart) / 260;
    if (bt >= 0 && bt <= 1) bump = Math.sin(Math.PI * bt) * cell * 0.22;
    var dir = heading(s.cells);

    ctx.save();
    ctx.translate(dir[0] * bump, dir[1] * bump);

    // Gövde örneklemesi (kıvrım dalgasıyla)
    var step = cell / 4;
    var samples = [];
    for (var a = tailArc; a <= headArc + 0.01; a += step) {
      var p = pointAt(s, Math.min(a, headArc));
      var wob = Math.sin(a / cell * 1.8 + now / 400 + s.phase) * cell * 0.045;
      samples.push({ x: p.x - p.dy * wob, y: p.y + p.dx * wob });
    }
    var hp = pointAt(s, headArc);
    var hd = { x: hp.dx, y: hp.dy };

    // Yolu kapatan yılan uyarısı: beyaz parlama
    if (now < s.flashUntil) {
      var glow = 0.5 + 0.5 * Math.sin(now / 90);
      ctx.strokeStyle = "rgba(255,255,255," + (0.5 + 0.4 * glow) + ")";
      ctx.lineWidth = w + cell * 0.28;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      strokePath(samples);
    }

    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = shade(s.color, 0.72);
    ctx.lineWidth = w + cell * 0.12;
    strokePath(samples);
    ctx.strokeStyle = s.color;
    ctx.lineWidth = w;
    strokePath(samples);
    ctx.strokeStyle = "rgba(255,255,255,.32)";
    ctx.lineWidth = w * 0.34;
    strokePath(samples);

    // Baş
    ctx.fillStyle = s.color;
    ctx.strokeStyle = shade(s.color, 0.72);
    ctx.lineWidth = cell * 0.06;
    ctx.beginPath();
    ctx.arc(hp.x, hp.y, w * 0.68, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Dil: kaçarken hep, beklerken ara sıra
    var tongueOn = s.state === "escaping" || Math.sin(now / 700 + s.phase * 3) > 0.86;
    if (tongueOn) {
      ctx.strokeStyle = "#e53935";
      ctx.lineWidth = cell * 0.05;
      var tx = hp.x + hd.x * w * 0.68, ty = hp.y + hd.y * w * 0.68;
      var fx = hp.x + hd.x * w * 1.15, fy = hp.y + hd.y * w * 1.15;
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(fx, fy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx - hd.y * w * 0.18 + hd.x * w * 0.14, fy + hd.x * w * 0.18 + hd.y * w * 0.14); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx + hd.y * w * 0.18 + hd.x * w * 0.14, fy - hd.x * w * 0.18 + hd.y * w * 0.14); ctx.stroke();
    }

    // Gözler
    var ex = -hd.y, ey = hd.x;   // baş yönüne dik
    [[1, 0], [-1, 0]].forEach(function (side) {
      var cx = hp.x + ex * side[0] * w * 0.3 + hd.x * w * 0.16;
      var cy = hp.y + ey * side[0] * w * 0.3 + hd.y * w * 0.16;
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(cx, cy, w * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#333";
      ctx.beginPath(); ctx.arc(cx + hd.x * w * 0.07, cy + hd.y * w * 0.07, w * 0.105, 0, Math.PI * 2); ctx.fill();
    });

    ctx.restore();
  }

  function strokePath(samples) {
    if (samples.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(samples[0].x, samples[0].y);
    for (var i = 1; i < samples.length; i++) ctx.lineTo(samples[i].x, samples[i].y);
    ctx.stroke();
  }

  function draw(now) {
    var sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#7ec8ff");
    sky.addColorStop(1, "#d9f5e0");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    drawBoard();
    // Bekleyenler altta, kaçanlar üstte
    var now2 = now;
    snakes.forEach(function (s) { if (s.state === "idle") drawSnake(s, now2); });
    snakes.forEach(function (s) { if (s.state === "escaping") drawSnake(s, now2); });
  }

  var lastTime = 0;
  function loop(t) {
    var dt = Math.min((t - lastTime) / 1000, 0.05);
    lastTime = t;
    update(dt);
    draw(t);
    requestAnimationFrame(loop);
  }

  window.addEventListener("resize", function () {
    // Kaçış ilerlemesini hücre oranıyla ölçekle ki animasyon sıçramasın
    var oldCell = board.cell;
    resize();
    if (oldCell > 0 && board.cell !== oldCell) {
      snakes.forEach(function (s) {
        if (s.state === "escaping") s.p = s.p * (board.cell / oldCell);
      });
    }
  });

  // Salt-okunur test kancası (oyun davranışını etkilemez)
  window.__yilanDebug = {
    cellPos: function (x, y) { return center(x, y); },
    snakes: function () {
      return snakes.map(function (s) {
        return { state: s.state, head: s.cells[0], cells: occupiedCells(s) };
      });
    },
    level: function () { return { w: curLevel.w, h: curLevel.h, n: snakes.length }; }
  };

  resize();
  loadLevel();
  requestAnimationFrame(function (t) { lastTime = t; requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
