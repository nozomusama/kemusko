<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Eşleştirme 🐣</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    font-family: "Comic Sans MS", "Chalkboard SE", "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    background: linear-gradient(160deg, #ffe29a 0%, #ffd3e0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2vh 4vw;
  }
  .home-btn {
    text-decoration: none;
    font-size: clamp(28px, 8vw, 44px);
    background: #fff;
    border-radius: 50%;
    width: clamp(52px, 14vw, 76px);
    height: clamp(52px, 14vw, 76px);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 5px 0 rgba(0,0,0,.12);
  }
  .home-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.12); }
  .stars {
    font-size: clamp(22px, 6vw, 36px);
    background: #fff;
    border-radius: 20px;
    padding: 1vh 4vw;
    box-shadow: 0 5px 0 rgba(0,0,0,.12);
    min-width: 20vw;
    text-align: center;
  }
  #board {
    flex: 1;
    width: 100%;
    max-width: 560px;
    display: grid;
    gap: 3vw;
    padding: 2vh 5vw 4vh;
    align-content: center;
    justify-content: center;
    min-height: 0;
  }
  .card {
    aspect-ratio: 3 / 4;
    perspective: 700px;
    cursor: pointer;
  }
  .card-inner {
    width: 100%; height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform .35s;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow: 0 6px 0 rgba(0,0,0,.15);
  }
  .face.back {
    background: repeating-linear-gradient(45deg, #66bb6a 0 14px, #81c784 14px 28px);
    border: 5px solid #fff;
    font-size: clamp(28px, 9vw, 52px);
  }
  .face.front {
    background: #fff;
    border: 5px solid #ffb300;
    transform: rotateY(180deg);
    font-size: clamp(44px, 14vw, 80px);
  }
  .card.matched .card-inner { animation: pop .45s; }
  .card.matched .face.front { border-color: #4caf50; background: #e8f5e9; }
  @keyframes pop {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.18); }
    100% { transform: rotateY(180deg) scale(1); }
  }
  .card.wrong .card-inner { animation: shake .4s; }
  @keyframes shake {
    0%,100% { transform: rotateY(180deg) translateX(0); }
    25% { transform: rotateY(180deg) translateX(-6px); }
    75% { transform: rotateY(180deg) translateX(6px); }
  }
  #celebrate {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,.55);
    z-index: 10;
  }
  #celebrate.show { display: flex; }
  #celebrate .msg {
    font-size: clamp(60px, 20vw, 130px);
    animation: bounce .6s infinite alternate;
  }
  @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.25); } }
  .confetti {
    position: fixed;
    top: -5vh;
    font-size: clamp(20px, 6vw, 36px);
    animation: fall linear forwards;
    z-index: 11;
    pointer-events: none;
  }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }
</style>
</head>
<body>
  <header>
    <a class="home-btn" href="../../index.html">🏠</a>
    <div class="stars">⭐ <span id="star-count">0</span></div>
  </header>
  <main id="board"></main>
  <div id="celebrate"><div class="msg">🎉</div></div>

<script src="../shared/adapt.js"></script>
<script>
(function () {
  "use strict";

  var EMOJIS = ["🐶","🐱","🐰","🦁","🐸","🐼","🐷","🦆","🐠","🍎","🍌","🚗","🚀","⚽","🌈","🦋"];
  var board = document.getElementById("board");
  var starCountEl = document.getElementById("star-count");
  var celebrateEl = document.getElementById("celebrate");

  var stars = 0;
  var locked = false;
  var firstCard = null;
  var matchedCount = 0;
  var totalPairs = 0;
  var mismatches = 0;
  var roundStart = 0;

  if (!window.KemalAdapt) {
    // Paylaşılan modül yüklenemezse basit yedek (kalıcı kayıt tutmaz)
    window.KemalAdapt = { create: function (g, o) {
      var lvl = o.start || 0;
      var streak = 0;
      return { get level() { return lvl; }, record: function (r) {
        if (r.hard) { lvl = Math.max(o.min, lvl - 1); streak = 0; }
        else if (r.smooth && ++streak >= (o.streak || 2)) { lvl = Math.min(o.max, lvl + 1); streak = 0; }
        else if (!r.smooth) streak = 0;
        return lvl;
      } };
    } };
  }
  // Kademeye göre çift sayısı: rahat geçen büyür, zorlanan küçülür
  var PAIRS_BY_TIER = [2, 3, 4, 5, 6, 8];
  var adapt = window.KemalAdapt.create("eslestirme", { min: 0, max: PAIRS_BY_TIER.length - 1, start: 0, streak: 2 });

  // --- Basit sesler (WebAudio, dosya gerekmez) ---
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function beep(freq, dur, type, delay) {
    if (!audioCtx) return;
    var t = audioCtx.currentTime + (delay || 0);
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.25, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur);
  }
  function soundFlip()  { beep(500, 0.1, "triangle"); }
  function soundMatch() { beep(660, 0.15, "sine"); beep(880, 0.2, "sine", 0.12); }
  function soundWrong() { beep(220, 0.25, "sawtooth"); }
  function soundWin()   { [523, 659, 784, 1047].forEach(function (f, i) { beep(f, 0.25, "sine", i * 0.15); }); }
  document.addEventListener("pointerdown", ensureAudio);

  // Arka planda geçen süre zorluk ölçümüne sayılmasın
  var hiddenAt = 0;
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) hiddenAt = performance.now();
    else if (hiddenAt) { roundStart += performance.now() - hiddenAt; hiddenAt = 0; }
  });

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  // Kart boyunu hem ENE hem BOYA sığacak şekilde seç: yatay/kısa ekranda
  // alt sıra viewport dışında kalırsa dokunulamaz ve tur bitirilemezdi.
  function fitGrid(cardCount) {
    var cs = getComputedStyle(board);
    var availW = board.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var availH = board.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var gap = parseFloat(cs.rowGap) || 10;
    var best = { cols: 2, w: 24 };
    for (var cols = 2; cols <= cardCount; cols++) {
      var rows = Math.ceil(cardCount / cols);
      var byW = (availW - gap * (cols - 1)) / cols;
      var byH = ((availH - gap * (rows - 1)) / rows) * 3 / 4;   // kart oranı 3:4
      var size = Math.min(byW, byH, 150);
      if (size > best.w) best = { cols: cols, w: size };
    }
    return best;
  }

  function applyGrid() {
    var count = board.children.length;
    if (!count) return;
    var g = fitGrid(count);
    board.style.gridTemplateColumns = "repeat(" + g.cols + ", " + Math.floor(g.w) + "px)";
  }

  window.addEventListener("resize", applyGrid);

  function newRound() {
    totalPairs = PAIRS_BY_TIER[adapt.level];
    matchedCount = 0;
    mismatches = 0;
    roundStart = performance.now();
    firstCard = null;
    locked = false;
    board.innerHTML = "";

    var picks = shuffle(EMOJIS.slice()).slice(0, totalPairs);
    var deck = shuffle(picks.concat(picks));

    deck.forEach(function (emoji) {
      var card = document.createElement("div");
      card.className = "card";
      card.dataset.emoji = emoji;
      card.innerHTML =
        '<div class="card-inner">' +
          '<div class="face back">❓</div>' +
          '<div class="face front">' + emoji + "</div>" +
        "</div>";
      card.addEventListener("pointerdown", function () { onCardTap(card); });
      board.appendChild(card);
    });
    applyGrid();
  }

  function onCardTap(card) {
    ensureAudio();   // kart dinleyicisi document'ten önce çalışır; ilk ses kaybolmasın
    if (locked || card.classList.contains("flipped")) return;
    soundFlip();
    card.classList.add("flipped");

    if (!firstCard) {
      firstCard = card;
      return;
    }

    var a = firstCard, b = card;
    firstCard = null;

    if (a.dataset.emoji === b.dataset.emoji) {
      a.classList.add("matched");
      b.classList.add("matched");
      soundMatch();
      stars++;
      starCountEl.textContent = stars;
      matchedCount++;
      if (matchedCount === totalPairs) {
        locked = true;
        setTimeout(winRound, 500);
      }
    } else {
      mismatches++;
      locked = true;
      setTimeout(function () {
        a.classList.add("wrong");
        b.classList.add("wrong");
        soundWrong();
        setTimeout(function () {
          a.classList.remove("flipped", "wrong");
          b.classList.remove("flipped", "wrong");
          locked = false;
        }, 700);
      }, 350);
    }
  }

  function winRound() {
    var dur = (performance.now() - roundStart) / 1000;
    adapt.record({
      hard: mismatches >= totalPairs * 2.5,
      smooth: mismatches <= totalPairs,
      cift: totalPairs, hata: mismatches, sure: Math.round(dur)
    });
    soundWin();
    celebrateEl.classList.add("show");
    throwConfetti();
    setTimeout(function () {
      celebrateEl.classList.remove("show");
      newRound();
    }, 2600);
  }

  var CONFETTI = ["🎉","⭐","🎈","✨","💛","🧡"];
  function throwConfetti() {
    for (var i = 0; i < 26; i++) {
      var piece = document.createElement("div");
      piece.className = "confetti";
      piece.textContent = CONFETTI[Math.floor(Math.random() * CONFETTI.length)];
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.animationDuration = 1.6 + Math.random() * 1.6 + "s";
      piece.style.animationDelay = Math.random() * 0.5 + "s";
      document.body.appendChild(piece);
      (function (p) { setTimeout(function () { p.remove(); }, 4000); })(piece);
    }
  }

  newRound();
})();
</script>
</body>
</html>
